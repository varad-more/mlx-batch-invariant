name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Apple Silicon runner: the kernels are Metal, so there is no point testing
    # anywhere else. macos-14 and later are arm64.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Refuse to run under Rosetta
        run: |
          python -c "import platform,sys; m=platform.machine(); print('machine:',m); sys.exit(0 if m=='arm64' else 'not arm64')"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Report device
        run: python -c "import mlx.core as mx; print(mx.__version__, mx.device_info())"

      - name: Invariance suite
        run: python -m unittest discover -s tests -v

      - name: CLI verify
        run: mlx-bi verify

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
