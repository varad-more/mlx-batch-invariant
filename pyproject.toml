[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-batch-invariant"
version = "0.1.0"
description = "Batch-invariant, bitwise-deterministic kernels for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Varad More" }]
keywords = ["mlx", "apple-silicon", "metal", "determinism", "batch-invariance", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.32.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/varad-more/mlx-batch-invariant"
Issues = "https://github.com/varad-more/mlx-batch-invariant/issues"

[project.scripts]
mlx-bi = "mlx_batch_invariant._cli:main"

[tool.setuptools]
packages = ["mlx_batch_invariant"]
